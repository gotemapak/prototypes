<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Depfit — tai chi walking prototype v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#0F202E; --text:#414142; --muted:#8A8A8E; --line:#E6E6E6; --idle:#BCBCBC;
  --accent:#FF2D55; --accent-top:#FF2D55; --accent-bot:#FF2D55; --accent-ink:#FFFFFF; --accent-soft:#FFF0F3; --accent-track:#FFD5DD; --coral:#FF5E50; --coral-soft:#FBB9B4; --lime:#3DBE6E; --lime-ink:#23994F; --lime-soft:#E8F7EE; /* один зелёный на всю воронку, как в walking-v3 */
  --dot:#E3E6EC; --ok:#3DBE6E; --star:#FFC107; --zebra:#FAFBF6; --warn:#FF2D55;
  --grad:linear-gradient(180deg,var(--accent-top),var(--accent-bot));
  --r:14px; --rc:16px; --serif:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif; --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,Segoe UI,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F2F2F4;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:440px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px 0;min-height:44px}
.back{width:36px;height:36px;border:0;background:transparent;font-size:30px;line-height:1;color:var(--idle);cursor:pointer}
.back[hidden]{visibility:hidden;display:block}
.logo,.count{display:none}
.bar{display:none}
.sections{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px 24px 0;min-height:16px}
.sections i{width:6px;height:6px;border-radius:50%;background:var(--dot)}
.sections i.on{background:var(--accent)}
main{flex:1;padding:24px 24px 130px;text-align:center}
h1,h2{font-family:var(--sans);font-weight:800;color:var(--ink);letter-spacing:-.01em}
h1{font-size:30px;line-height:1.3;margin-bottom:12px}
h2{font-size:28px;line-height:1.3;margin-bottom:12px}
.sub{color:var(--text);font-weight:300;font-size:16px;line-height:1.55;margin:0 auto 24px;max-width:340px}
.sub b{font-weight:700;color:var(--ink)}.sub b.red{color:var(--accent)}
p{color:var(--text)}
.opts{display:flex;flex-direction:column;gap:16px;text-align:left}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:14px 16px 14px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);font:600 16px var(--sans);color:var(--ink);text-align:left;cursor:pointer;transition:border-color .15s}
.opt:hover{border-color:#D0D0D0}
.opt.sel{border-color:var(--accent);background:var(--card)}
.opt .box{order:2;width:22px;height:22px;border:2px solid var(--idle);border-radius:50%;flex:none;display:grid;place-items:center;margin-left:auto}
.opt.sel .box{border-color:var(--accent)}
.opt.sel .box:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.opts.multi .opt .box{border-radius:7px}
.opts.multi .opt.sel .box{background:var(--accent)}
.opts.multi .opt.sel .box:after{width:5px;height:10px;border-radius:0;background:none;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt small{display:block;color:var(--muted);font-size:14px;font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.agecard{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);overflow:hidden;cursor:pointer;font:inherit;color:inherit;padding:0;text-align:left;transition:border-color .15s}
.agecard.sel,.agecard:hover{border-color:var(--accent)}
.agecard .ph{aspect-ratio:4/5;border-radius:0;margin:0}
.agecard>span{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700;background:var(--grad);color:#fff}
.ph{background:linear-gradient(160deg,#F4F4F6,#E7E7EB);border-radius:var(--rc);display:flex;align-items:flex-end;padding:10px;color:#8A8A8E;font-size:12px;line-height:1.3;margin:6px 0 20px;min-height:120px;text-align:left}
.ph b{font-weight:700}
img.ph.pic{display:block;width:100%;height:auto;min-height:0!important;padding:0;background:none;object-fit:cover;aspect-ratio:1200/780}
img.ph.pic.cut{aspect-ratio:auto;object-fit:contain;max-height:300px}
img.thumb.pic{padding:0;background:none;object-fit:cover}
.agec img.ph.pic{aspect-ratio:1;object-fit:cover}
.zones img.ph.pic{max-height:none;height:100%;object-fit:contain}
.ng img.ph.pic{aspect-ratio:600/900;height:auto}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;padding:12px 24px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,255,255,0),#fff 30%)}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:var(--r);background:var(--grad);color:var(--accent-ink);font:600 16px var(--sans);cursor:pointer;box-shadow:0 8px 20px rgba(255,45,85,.28)}
.btn:disabled{background:#FFB8C6;box-shadow:none;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600;margin-top:12px}
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:16px 18px;margin:16px 0;text-align:left}
.big{font-family:var(--sans);font-size:44px;line-height:1.1;color:var(--accent);font-weight:800}
.cite{font-size:13px;color:var(--muted);margin-top:8px}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 20px;min-height:56px;margin-bottom:16px;text-align:left}
.field:focus-within{border-color:var(--accent)}
.field{min-width:0}
.field input{flex:1;width:100%;border:0;outline:0;font:700 22px var(--sans);background:transparent;color:var(--ink);min-width:0}
.field label{color:var(--muted);font-size:16px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:3px;margin-bottom:20px}
.seg button{border:0;background:transparent;padding:8px 20px;border-radius:var(--r);font:600 15px var(--sans);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--grad);color:#fff}
.bmi{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,#4BCBF6,#3DBE6E 35%,#FFC107 65%,#FF2D55);margin:34px 0 8px}
.bmi i{position:absolute;top:-32px;transform:translateX(-50%);background:var(--ink);color:#fff;font:700 13px var(--sans);padding:3px 9px;border-radius:10px;white-space:nowrap}
.bmi i:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;text-align:left}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-size:14px;color:var(--muted)}
.kv b{display:block;color:var(--ink);font-size:18px;font-weight:800}
.steps{list-style:none;margin:24px 0;text-align:left}
.steps li{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-weight:600}
.steps li span{color:var(--muted);font-size:14px;font-weight:400}
.steps li.done span{color:var(--accent);font-weight:700}
.track{height:4px;background:#E6E6E6;border-radius:2px;overflow:hidden;margin-top:8px}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s}
.review{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:16px;margin:12px 0;text-align:left}
.review p{font-size:15px;font-weight:300;line-height:1.6}
.review footer{margin-top:10px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:50%;background:#EDEDF0;flex:none;display:grid;place-items:center;font-size:10px;color:#8A8A8E}
.stars{color:var(--star);letter-spacing:3px;font-size:17px}
svg.chart{width:100%;height:auto;margin:8px 0 6px}
.sticky{position:sticky;top:0;z-index:5;background:var(--grad);color:#fff;margin:-24px -24px 20px;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600}
.sticky b{font-variant-numeric:tabular-nums;font-size:18px}
.nowgoal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.nowgoal div{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:10px;text-align:center;font-size:14px;color:var(--muted)}
.nowgoal .ph{min-height:150px;margin:0 0 8px}
.nowgoal b{display:block;color:var(--ink);font-size:16px}
.plan{border:2px solid var(--accent);background:var(--card);border-radius:var(--rc);padding:18px;margin:16px 0;position:relative;text-align:left}
.plan .tag{position:absolute;top:-12px;left:16px;background:var(--grad);color:#fff;font-size:12px;font-weight:700;padding:3px 12px;border-radius:12px}
.plan .row{display:flex;justify-content:space-between;align-items:baseline}
.plan .price{font-size:34px;font-weight:800}
.plan s{color:var(--muted);font-size:16px}
.fine{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;text-align:left}
.list{list-style:none;margin:10px 0;text-align:left}
.list li{padding:9px 0 9px 30px;position:relative;font-weight:500}
.list li:nth-child(odd){background:var(--zebra)}
.list li:before{content:"";position:absolute;left:8px;top:15px;width:12px;height:7px;border:solid var(--ok);border-width:0 0 2px 2px;transform:rotate(-45deg)}
details{border-bottom:1px solid var(--line);padding:14px 0;text-align:left}
summary{font-weight:700;cursor:pointer}
details p{color:var(--text);margin-top:8px;font-size:15px;font-weight:300}
.pay{display:flex;gap:8px;justify-content:center;margin:12px 0;font-size:12px;color:var(--muted)}
.pay span{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card)}
.src{display:none;margin:22px 0 0;padding:12px 14px;border:1px dashed #C9C9CF;border-radius:12px;background:#F6F6F8;font-size:13px;color:#555;line-height:1.45;text-align:left}
body.showsrc .src{display:block}
.toggle{position:fixed;right:12px;top:12px;z-index:50;background:var(--ink);color:#fff;border:0;border-radius:20px;padding:8px 12px;font:500 13px var(--sans);cursor:pointer;opacity:.85}
.jump{position:fixed;right:12px;top:52px;z-index:50;font:13px var(--sans);max-width:150px}
@media (max-width:700px){.toggle{top:auto;right:auto;left:10px;bottom:96px;padding:6px 10px;font-size:12px;opacity:.7}.jump{display:none}}
.modal{position:fixed;inset:0;background:rgba(15,32,46,.5);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:#fff;width:100%;max-width:440px;border-radius:32px 32px 0 0;padding:26px 24px 28px;text-align:center}
.mock{border:1.5px dashed #D0D0D6;border-radius:var(--rc);padding:18px;text-align:center;color:var(--muted);font-size:15px;margin:16px 0}

/* ---------- v3: структура WalkFit indoor в стиле v2 ---------- */
header{justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;height:30px}.logo img{height:26px;display:block}.logo img.ic{height:30px;width:30px;border-radius:8px}
.count{display:block;min-width:36px;text-align:right;font-size:14px;font-weight:600;color:var(--muted)}
.bar{display:block;height:4px;background:var(--line);margin:10px 16px 0;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lime);border-radius:2px;transition:width .3s}
.sections{display:none}
.btn{text-transform:none;letter-spacing:0;font-weight:600}
.link{display:block;margin:14px auto 0;background:none;border:0;font:600 14px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.opt .box{order:0;margin-left:0}
.opt .lbl{flex:1}
.opt .emo{font-size:26px;line-height:1;flex:none}
.thumb{width:56px;height:56px;border-radius:14px;background:linear-gradient(160deg,#F4F4F6,#E7E7EB);font-size:9px;line-height:1.15;color:#8A8A8E;display:grid;place-items:center;text-align:center;padding:4px;flex:none;font-weight:400}
.sig{display:flex;gap:3px;align-items:flex-end;flex:none}
.sig i{width:5px;background:var(--line);border-radius:1px}
.sig i.on{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips .opt{width:auto;min-height:44px;padding:10px 16px;justify-content:center;text-align:center}
.chips .box,.zones .box{display:none}
.zones{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:stretch}
.zones .ph{margin:0;min-height:100%}
.zones .opts{gap:10px}
.zones .opt{justify-content:center;text-align:center;min-height:46px;padding:10px}
.agegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;margin-top:8px}
.agec{background:none;border:0;cursor:pointer;font:inherit;padding:0}
.agec .ph{aspect-ratio:1;border-radius:50%;margin:0 0 -16px;min-height:0;align-items:center;justify-content:center;text-align:center}
.agec>span{position:relative;display:inline-flex;gap:8px;align-items:center;padding:8px 18px;border-radius:20px;background:var(--grad);color:#fff;font-weight:700}
.kicker{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin:-6px 0 18px}
.left{text-align:left}
.left .sub{margin-left:0}
.hint{background:#FFF8EC;border-radius:var(--rc);padding:14px 16px;text-align:left;margin-top:8px;font-size:15px}
.hint b{display:block;margin-bottom:4px;color:var(--ink)}
.err{color:var(--warn);font-size:14px;min-height:20px;margin:-6px 0 8px;text-align:left}
.field.big input{font-size:34px;text-align:center}
.field.big{justify-content:center}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.stat3 div{background:var(--accent-soft);border-radius:16px;padding:10px 6px;font-size:12px;color:var(--muted);text-align:center}
.stat3 b{display:block;color:var(--ink);font-size:16px}
.weekrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10px;color:var(--muted);text-align:center;margin:6px 0}
.weekrow i{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 3px;border-radius:50%;border:2px solid var(--accent-track);font-style:normal;font-size:11px;color:var(--ink)}
.weekrow i.d{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:16px;margin:12px 0;text-align:left}
.rowkv{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.rowkv:last-child{border-bottom:0}
.rowkv b{color:var(--ink)}
.risk{background:var(--accent-soft);border-radius:var(--rc);padding:14px 16px;text-align:left;font-size:14px}
.risk b{display:block;color:var(--ink);margin-bottom:4px}
.ring{width:170px;height:170px;margin:6px auto 10px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:800;color:var(--ink)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -24px 0;padding:0 24px 8px}
.carousel .review{flex:0 0 82%;scroll-snap-align:start;margin:0}
.pill{display:inline-flex;gap:8px;align-items:center;background:var(--lime-soft);color:var(--lime-ink);font-size:13px;font-weight:800;letter-spacing:.04em;padding:8px 14px;border-radius:20px;margin:4px 0 14px}
.red{color:var(--accent)}
.green{color:var(--lime-ink)}
.splash{position:fixed;inset:0;z-index:30;background:#fff;color:var(--ink);overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px}
.splash small{font-size:18px;color:var(--text);position:relative}
.splash img.lg{height:44px;margin:8px 0 28px;position:relative}
.splash:before,.splash:after{content:"";position:absolute;border-radius:50%;right:-120px;bottom:-140px;width:360px;height:360px;background:var(--coral-soft)}
.splash:after{right:-170px;bottom:-170px;width:330px;height:330px;background:var(--coral)}

.splash p{color:var(--ink);font-size:19px;font-weight:600;margin:6px 0;opacity:0;animation:fi .5s forwards;position:relative;z-index:1}
.splash .btn{margin-top:30px;max-width:340px;opacity:0;animation:fi .5s 2.2s forwards;position:relative;z-index:1}
@keyframes fi{to{opacity:1}}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--accent-track);border-top-color:var(--accent);margin:40vh auto 0;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.thumb.pic[src$="depfit-logo.png"]{object-fit:contain;padding:8px 6px;background:#fff;border:1px solid var(--line)}
/* paywall */
.topbar{position:sticky;top:0;z-index:6;background:#fff;margin:-24px -24px 16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);text-align:left}
.topbar small{display:block;font-size:12px;color:var(--text)}
.topbar b{font-size:24px;font-variant-numeric:tabular-nums}
.topbar .btn{width:auto;min-height:42px;padding:0 18px;font-size:14px}
.ng{border:1px solid var(--line);border-radius:var(--rc);overflow:hidden;margin-bottom:6px}
.ng .hd{display:grid;grid-template-columns:1fr 1fr;background:#F6F1EA;font-weight:700;padding:8px 0}
.ng .ph{margin:0;border-radius:0;min-height:170px}
.ng .cols{display:grid;grid-template-columns:1fr 1fr}
.ng .cols>div{padding:10px 12px;text-align:left;font-size:13px;color:var(--muted)}
.ng .cols>div+div{border-left:1px solid var(--line)}
.ng .cols b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.seg5{display:flex;gap:3px;margin-top:4px}
.seg5 i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.seg5 i.on{background:var(--accent)}
.disc{font-size:12px;color:var(--muted);margin:6px 0 16px}
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.sum2 div{border:1px solid var(--line);border-radius:18px;padding:10px 12px;text-align:left;font-size:13px;color:var(--muted)}
.sum2 b{display:block;color:var(--ink);font-size:17px}
.offer{background:var(--ink);color:#fff;border-radius:16px;padding:12px;font-weight:700;margin:12px 0 4px}
.boost{background:var(--accent-soft);border-radius:var(--rc);padding:14px;margin:6px 0 6px}
.boost h3{font-size:20px;line-height:1.3}
.boost s{color:var(--muted)}
.above{font-size:13px;color:var(--muted);text-align:left;margin:18px 0 6px;font-weight:600}
.pl{border:1.5px solid var(--line);border-radius:20px;padding:16px 14px;position:relative;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;background:#fff}
.pl.sel{border-color:var(--accent);background:var(--accent-soft)}
.pl .rb{width:22px;height:22px;border-radius:50%;border:2px solid var(--idle);flex:none;display:grid;place-items:center}
.pl.sel .rb{border-color:var(--accent)}
.pl.sel .rb:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.pl .rib{position:absolute;bottom:100%;left:-1.5px;right:-1.5px;background:var(--lime);color:#fff;font-size:12px;font-weight:800;padding:4px 0;border-radius:14px 14px 0 0;text-align:center;white-space:nowrap;letter-spacing:.06em}
.pl .mid{flex:1}
.pl .mid b{display:block;font-size:17px}
.pl .tag2{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:#F6F1EA;color:var(--text);margin:3px 0}
.pl.sel .tag2.save{background:var(--accent);color:#fff}
.pl .pr{font-size:14px;color:var(--muted)}
.pl .pr s{margin-right:6px}
.pl .pr span{color:var(--ink);font-weight:700}
.pd{display:flex;align-items:flex-start;gap:1px;background:#F2F2F4;border-radius:12px;padding:6px 10px;flex:none;position:relative;min-width:84px;justify-content:center}
.pd .o{position:absolute;top:-17px;right:4px;font-size:11px;color:var(--muted);text-decoration:line-through}
.pd sup{font-size:13px;font-weight:700;margin-top:4px}

<script>
// Прототип taichi-v1: воронка WalkUp «Tai Chi Walking For Beginners» (прогон 10 ноября 2026) экран в экран, тексты 1 в 1, бренд Depfit как в прототипе v3.
// Картинок пока нет: плашки «Image NNN», список — content-plan.md. Готовые картинки класть в img/ и вписывать в IMG по номеру плашки.
const BRAND='Depfit', DOMAIN='our website' /* домен Depfit — TBD */, LOGO='img/depfit-logo.png', ICON='img/depfit-icon.png', APP_URL='https://apps.apple.com/app/id1456357156';
const ORIG='orig/';
const TOTAL=23;

// ---------- state ----------
const S={answers:{},hu:'cm',wu:'kg',h:null,w:null,goal:null,age:null,event:'',plan:'w4',deadline:0,exitShown:false};
const pad=n=>String(n).padStart(3,'0');
const fmtS=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const iso=d=>d.toISOString().slice(0,10);
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return d};
const kg=v=>S.wu==='kg'?v:v*0.45359237;
const hm=()=>S.h?(S.hu==='cm'?S.h/100:S.h*0.0254):1.80;
const wkg=()=>S.w?kg(S.w):89, gkg=()=>S.goal?kg(S.goal):80;
const bmi=()=>wkg()/(hm()*hm());
const tbmi=()=>gkg()/(hm()*hm());
/* WalkUp Purchase: процент жира по ИМТ — для «Now» от текущего веса, для «Your Goal» от целевого */
const fatRange=b=>b<18.5?'8–12%':b<25?'12–24%':b<30?'25–31%':b<35?'32–39%':b<40?'40–45%':'>45%';
const BODY_CUR=['Slim','Mid-sized','Full-figured','Extended size'],BODY_TGT=['Thin','Toned','Average','Curvy'];
const bodyIdx=id=>{const L=id==='s09'?BODY_CUR:BODY_TGT,i=L.indexOf(S.answers[id]);return i<0?(id==='s09'?2:2):i+1};
const wTxt=()=>`${S.w||89} ${S.wu}`, goalTxt=()=>`${S.goal||80} ${S.wu}`;
/* как у WalkUp (OccasionResult): дней до цели = ceil(|вес − цель| / 0.14) в единицах ввода; дата цели = сегодня + дни */
const goalDays=()=>Math.ceil(Math.abs((+(S.w||89))-(+(S.goal||80)))/0.14);
/* дробь месяцев между сегодня и датой цели — как dayjs diff 'month' (целые месяцы, вниз) */
const monthDiff=(a,b)=>{let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;return m};
/* график 033: шаблон и подписи зависят от направления (сбросить / набрать / держать) и от числа месяцев до цели */
function goalChart(){
 const now=new Date(),goal=plus(goalDays()),st=+(S.w||89),g=+(S.goal||80),u=S.wu;
 const M=k=>new Date(now.getFullYear(),now.getMonth()+k,1).toLocaleDateString('en-US',{month:'short'});
 const SM=(goal.getFullYear()-now.getFullYear())*12+goal.getMonth()-now.getMonth(); // месяц цели от текущего
 const r1=v=>Math.round(v*10)/10, mo=monthDiff(now,goal);
 let tpl,pts,months;
 if(g===st){tpl='keep_weight';pts=[g];months=[M(0)]}
 else if(g>st){tpl='low_to_high';pts=[st,g];months=[M(0),M(SM)]}
 else if(mo<=0){tpl='high_to_low_two_other';pts=[st,g];months=[M(0),M(0),M(1)]}
 else if(mo===1){tpl='high_to_low_two';pts=[st,g];months=[0,1,2,3,4].map(M)}
 else if(mo===2){tpl='high_to_low_three';pts=[st,Math.round(st-4.2),g];months=[0,1,2,3,4].map(M)}
 else {tpl='high_to_low_four';pts=[st,r1(st-4.2),r1(g+4.2),g];months=[M(0),M(1),M(SM-1),M(SM),M(SM+1)]}
 const X0=34,X1=290,n=pts.length,xp=i=>n===1?(X0+X1)/2:X0+i*(X1-X0)/(n-1);
 const hi=Math.max(...pts),lo=Math.min(...pts),Y0=46,Y1=124,yp=w=>hi===lo?(Y0+Y1)/2:Y0+(hi-w)/(hi-lo)*(Y1-Y0);
 const P=pts.map((w,i)=>[xp(i),yp(w)]);
 let line=`M${P[0][0]} ${P[0][1]}`;for(let i=1;i<n;i++){const [x0,y0]=P[i-1],[x1,y1]=P[i],cx=(x0+x1)/2;line+=` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`}
 const tag=(cx,cy,w,fill,txt,col='#fff',fs=12)=>{const l=Math.min(320-w,Math.max(0,cx-w/2));return `<rect x="${l}" y="${cy}" width="${w}" height="22" rx="10" fill="${fill}"/><text x="${l+w/2}" y="${cy+15}" text-anchor="middle" font-size="${fs}" fill="${col}" font-weight="700">${txt}</text>`};
 const mx=i=>months.length===1?(X0+X1)/2:X0+i*(X1-X0)/(months.length-1);
 const cols=['#FF5E50','#FF9800','#FFC107','#3DBE6E'];
 const svg=`<svg class="chart" viewBox="0 0 320 170"><defs><linearGradient id="cg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF5E50" stop-opacity=".35"/><stop offset="1" stop-color="#FF2D55" stop-opacity="0"/></linearGradient></defs>${months.map((m,i)=>`<line x1="${mx(i)}" y1="20" x2="${mx(i)}" y2="145" stroke="#E6E6E6" stroke-dasharray="3 4"/>`).join('')}
 ${n>1?`<path d="${line} L${X1} 145 L${X0} 145Z" fill="url(#cg)"/><path d="${line}" stroke="#FF5E50" stroke-width="3" fill="none"/>`:''}
 ${P.map(([x,y],i)=>{const last=i===n-1,c=last?'#FF2D55':cols[Math.min(i,2)];return `<circle cx="${x}" cy="${y}" r="${last||i===0?7:5}" fill="#fff" stroke="${c}" stroke-width="3"/>${last?tag(x,y-62,96,'#FF2D55','Expected Result','#fff',11):''}${tag(x,y-32,58,last?'#0F202E':c,pts[i]+' '+u)}`}).join('')}
 ${months.map((m,i)=>`<text x="${mx(i)}" y="163" font-size="12" fill="#8A8A8E" text-anchor="middle">${m}</text>`).join('')}</svg>`;
 return {goal,svg,tpl};
}
let CUR=1;
// готовые картинки: ключ — номер плашки ('003', '005-1', 'P01'), значение — файл в img/
const IMG={};
const ph=(t,st='',id)=>{id=id||pad(CUR);const f=IMG[id];return f?`<img class="ph pic${f.endsWith('.png')?' cut':''}" src="img/${f}" alt="${t.replace(/"/g,'')}" style="${st}">`:`<div class="ph" style="${st}"><span><b>Image ${id}</b> · ${t}</span></div>`};
const th=t=>/\.(png|jpg)$/.test(t)?`<img class="thumb pic${t.startsWith('body-')?' tall':''}" src="img/${t}" alt="">`:`<span class="thumb">${t}</span>`;
const sig=n=>`<span class="sig">${[6,9,12,15,18].map((h,i)=>`<i class="${i<n?'on':''}" style="height:${h}px"></i>`).join('')}</span>`;
const icon=x=>!x?'':x.startsWith('img:')?th(x.slice(4)):x.startsWith('ph:')?th(IMG[x.slice(3)]||`Image<br>${x.slice(3)}`):x.startsWith('sig:')?sig(+x.slice(4)):`<span class="emo">${x}</span>`;
const checks=a=>`<ul class="checks">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const tip=(e,b,t)=>`<div class="tip"><span class="tl">${e}</span><div><b>${b}</b>${t}</div></div>`;
function weekTable(withPeople){
 const W=[['6min<br>Upper body','7min<br>Full body','6min<br>Lower body','Rest','7min<br>Full body','8min<br>Lower body','5min<br>Full body'],
          ['5min<br>Full body','7min<br>Upper body','6min<br>Full body','Rest','7min<br>Full body','8min<br>Lower body','6min<br>Upper body'],
          ['7min<br>Full body','Rest','8min<br>Upper body','7min<br>Lower body','Rest','8min<br>Full body','6min<br>Full body']];
 return `<div class="wk"><table><tr><th></th>${[1,2,3,4,5,6,7].map(d=>`<th>Day ${d}</th>`).join('')}</tr>${W.map((r,i)=>`<tr><td class="w">WEEK ${i+1}</td>${r.map(c=>`<td class="${c==='Rest'?'r':''}">${c}</td>`).join('')}</tr>`).join('')}</table>${withPeople?`<div class="ppl">${ph('cut-out from the waist up: woman ~60 and man ~65 in light tai chi wear, arms spread wide in a tai chi pose, overlapping the table')}</div>`:''}</div>`}

{id:'s01',n:1,type:'custom',noCta:true,src:'Возраст: сетка 2×2 карточек с фото пары и плашкой «Age: …», тап → дальше. Без счётчика и назад. Галочка согласия стоит заранее. У WalkUp справа меню и кнопка «?» (Help), переключатель языка — их не переносим.',

{id:'s02',n:2,p:1,type:'q',q:'What\'s your gender?',sub:'we match coaches based on gender',opts:['Female','Male'],src:'Подзаголовок со строчной буквы — как у WalkUp.'},
{id:'s03',n:3,type:'info',cta:'CONTINUE',html:()=>`<div class="big" style="margin-top:8px">Over 10+ Million women</div><p class="sub" style="margin-top:8px">Join us to start <span class="red">Tai Chi Walking</span> journey</p>${ph('round photo, bright living room, three people breaking out of the circle: woman ~65 in the centre, women ~50 and ~45 at the sides, all in a tai chi stance, palms forward','min-height:320px;border-radius:50%;aspect-ratio:1;max-width:340px;margin:10px auto')}`},
{id:'s04',n:4,type:'info',cta:'CONTINUE',html:()=>`<h2 class="left">Welcome to <span class="red">Tai Chi Walking</span> World!</h2>${weekTable(true)}<p class="sub left" style="text-align:left">We <b class="red">specialize in Tai Chi Walking</b> to help you move with joy, overcome limits, and feel your best. Let’s start by learning about your goals.</p>`,src:'Таблица недель собрана вёрсткой (у WalkUp — картинка), поверх неё пара по пояс — картинка.'},
{id:'s05',n:5,p:3,type:'q',q:'Choose your goal',opts:[['Lose weight','ph:005-1'],['Energy and vitality','ph:005-2'],['Wellness and longevity','ph:005-3'],['Improve flexibility','ph:005-4'],["I'm not sure"]]},
{id:'s06',n:6,type:'info',cta:'CONTINUE',html:()=>`<h2 class="left">The perfect approach is right here!</h2>${ph('round photo: woman ~65 in a tai chi stance in a sunlit living room, three small round 3D bubbles (neck, spine, lower back) at the right edge','min-height:240px')}<p class="sub" style="text-align:left;margin-bottom:8px"><span class="red"><b>Tai Chi Walking</b></span> cultivates <b class="red">inner balance and physical vitality</b>. It nurtures:</p>${checks(['Improved stability for effortless, fluid movement.','Reduced risk of falls and injuries.','A foundation for a healthier, more vibrant life.'])}`},
{id:'s07',n:7,p:4,type:'q',q:'Have you tried Tai Chi?',opts:[['Yes','🤗'],['No','🙅']]},
{id:'s08',n:8,type:'info',cta:'CONTINUE',html:()=>`<h2 class="left">Joint Health for Life!</h2>${ph('round photo: woman ~65 in a slow tai chi step, arm forward; three round 3D bubbles with red pain spots (neck/shoulder, upper back, lower back)','min-height:260px')}<p class="sub" style="text-align:left">For those with joint pain, strenuous exercise can be a barrier. <b class="red">Tai Chi Walking</b> offers a gentle alternative, a low-impact art that can be <b class="red">practiced for a lifetime</b>, providing <b class="red">soothing relief and lasting wellness.</b></p>`},
{id:'s09',n:9,p:7,type:'q',q:'Choose your current body type',sub:'Choose the best option for you',opts:[['Slim','ph:009-1'],['Mid-sized','ph:009-2'],['Full-figured','ph:009-3'],['Extended size','ph:009-4']],src:'У WalkUp — фото торса одной модели в 4 размерах: серый спортивный топ и леггинсы, кадр от груди до колен, одинаковый масштаб. Нужно сгенерировать 4 таких фото (заглушки 009-1…009-4).'},

{id:'s11',n:11,p:10,type:'m',layout:'zones',q:'Choose your target zones',img:'full-body cut-out: woman ~60 standing straight, arms down, light tai chi wear, frontal, head to feet',opts:['Arms','Chest','Abs','Butt','Legs','Full Body'],cta:'CONTINUE',src:'Экраны 011–014 — один экран в разных состояниях. Выбор подсвечивает зону на фигуре размытым оранжевым пятном (руки — оба плеча, ноги — оба бедра), кнопка — голубая с синей рамкой. Full Body — подсветка всей фигуры. Фото 011 должно стоять в фиксированном кадре, чтобы пятна попадали на зоны. CONTINUE неактивна, пока ничего не выбрано.'},
{id:'s15',n:15,p:11,type:'q',q:'How long was the last time you were in the best shape of your life?',opts:[['Less than a year ago','🤔'],['1 to 2 years ago','😅'],['More than 3 years ago','🥲'],['I am confident in my body','😌'],['Never','❌']],src:'Варианта «2 to 3 years ago» у WalkUp нет — так и оставлено.'},
{id:'s16',n:16,type:'info',cta:'CONTINUE',html:()=>`<h2 class="left">The <span class="red">Tai Chi Walking Plan</span> makes you painless and healthier</h2>${ph('round park photo: woman ~60 in a deep slow tai chi step, 3/4 side view, orange glow on the hip; small inset of a pelvis with a red zone and three tiny joint icons','min-height:200px')}<p class="sub" style="text-align:left;margin-bottom:8px">The slow, deliberate movements of Tai Chi Walking are key to fall prevention. They strengthen the pelvic floor and leg muscles, improving your body's proprioception and stability.</p>${checks(['Builds leg and core strength.','Enhances joint flexibility.','Refines balance and coordination.'])}`},

{id:'s27',n:27,type:'info',cta:'CONTINUE',src:'Шрифт цитаты крупнее, чем у WalkUp (20 px), — аудитория 55+. Фото — вертикальный портрет со скруглением, ~¾ ширины.',html:()=>`<h2 class="left"><span class="red">Tai Chi Walking</span> is an Art of Living Longer</h2>${ph('portrait photo 4:5, rounded: smiling woman ~70, grey hair in a bun, arms stretched to the sides in a tai chi pose, bright home with a window to the garden, warm light','aspect-ratio:4/5;width:78%;min-height:0;margin:8px auto 18px;border-radius:28px','027')}<p class="quote">“Tai Chi <b>reduces mortality rates</b> in older adults by 20-30% over a 10-year period. Mechanisms: <b>Improved heart health, better stress management, and fewer falls.</b>”</p><p class="qby">—— Harvard Health Publishing</p>`},
{id:'s28',n:28,type:'info',cta:'CONTINUE',src:'Как у WalkUp (Profile). ИМТ = вес, кг / рост, м² (lb × 0,45359237). Категория: < 18,5 — UNDERWEIGHT, но на экране пишется NORMAL; 18,5–24,9 — NORMAL; до 30 — OVERWEIGHT; от 30 — OBESE. Маркер «You-ИМТ»: (ИМТ − 15) / 25 от ширины шкалы, от 0 до 92%. Подсказка: NORMAL и UNDERWEIGHT — «Good Starting BMI…», OVERWEIGHT и OBESE — «Risks for an unhealthy BMI». Три строки справа: Activity level — ответ 017, Body type — ответ 009, Age Group — ответ 001. Фото слева — картинка выбранного на 009 типа тела (та же, что Now на пейволле), 4 версии: заглушки P01-1…P01-4.',

 return `<h2 class="left">Here's your health profile summary</h2><div class="prof">${ph(`cut-out: woman ~55, current body type «${BODY_CUR[ci-1]}», light linen top, frontal, head to mid-thigh (same image as Now on the paywall)`,'',`P01-${ci}`)}<div class="st"><div><small>Activity level</small><b>🚶 ${S.answers.s17||'Sedentary'}</b></div><div><small>Body type</small><b>🎯 ${S.answers.s09||'Mid-sized'}</b></div><div><small>Age Group</small><b>📋 ${S.answers.s01||'Age: 50-59'}</b></div></div></div>

 ${ok?`<p style="margin-top:12px;font-size:14px"><b style="color:var(--ink)">Good Starting BMI for Fitness Goals</b><br>Based on research, an ideal body fat percentage to start gaining muscle and building a fit body faster is between 18% and 25%.</p>`:`<p style="margin-top:12px;font-size:14px"><b style="color:var(--ink)">Risks for an unhealthy BMI</b><br>Elevated blood pressure, cardiovascular conditions, cerebral vascular accidents, diabetes mellitus type 2, certain cancers, degenerative joint disease, lumbar discomfort, and overall increased risk of mortality.</p>`}</div>`}},

{id:'s33',n:33,type:'info',cta:'CONTINUE',src:'Как у WalkUp (OccasionResult). Дней до цели = ceil(|текущий вес − целевой| / 0,14), в единицах ввода (у WalkUp и для lb 0,14 lb в день — план в фунтах выходит в 2,2 раза длиннее); дата цели = сегодня + дни. Проверено на прогоне: 89 → 80 кг 10 ноября → 65 дней → 14 января 2027. Заголовок «{цель} {kg|lb} by {дата}». Шаблон графика: цель = вес — keep_weight (одна точка, текущий месяц); цель > вес — low_to_high (вес → цель, текущий месяц и месяц цели); цель < вес — по целым месяцам до цели: 0 — две точки, месяцы M, M, M+1; 1 — две точки, M…M+4; 2 — три точки (вес, вес − 4,2 с округлением, цель), M…M+4; 3 и больше — четыре точки (вес, вес − 4,2, цель + 4,2, цель), месяцы M, M+1, S−1, S, S+1, где S — месяц цели. Последняя точка — «Expected Result». Подсказка «Get ready to amaze everyone at …» — повод из 029; у WalkUp повод не подставился (на прогоне пусто), у нас подставляем, при «Other» и «No» — без хвоста.',

  const glows=c.includes('Full Body')?'<i class="glow all"></i>':c.filter(z=>GLOW[z]).flatMap(z=>GLOW[z].map(([l,t])=>`<i class="glow" style="left:${l}%;top:${t}%"></i>`)).join('');
  h=`<h2>${s.q}</h2>${s.sub?`<p class="sub">${s.sub}</p>`:'<div style="height:12px"></div>'}`+(s.layout==='zones'?`<div class="zones"><div class="zb">${ph(s.img)}${glows}</div><div class="opts">${os}</div></div>`:`<div class="opts multi">${os}</div>`);cta=s.cta||'CONTINUE'}
 else if(s.type==='info'){h=s.html();cta=s.cta||'CONTINUE'}
 else {h=s.render();cta=s.noCta?null:(s.cta||'CONTINUE')}
 const file=s.file||(s.n&&s.n<=35?pad(s.n)+'-screen.jpg':null);
 const srcTxt=`${s.n?`WalkUp ${pad(s.n)}. `:''}${s.src||''}`;
 m.innerHTML=h+`<div class="src"><b>Источник:</b> ${srcTxt}${file?`<img src="${ORIG+file}" alt="">`:''}</div>`+(cta?`<div class="cta"><button class="btn" id="cta">${cta}</button>${s.after||''}</div>`:'');
 if(s.type==='q')m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=b.dataset.v;S.answers[s.id]=v;b.classList.add('sel');setTimeout(()=>{const k=s.skip&&s.skip(v);k?go(k):next()},180)});
 if(s.type==='m'){const btn=$('#cta');btn.disabled=!(S.answers[s.id]||[]).length;m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=b.dataset.v;let c=S.answers[s.id]||[];if(s.none&&v===s.none)c=c.includes(v)?[]:[v];else{c=c.filter(x=>x!==s.none);c=c.includes(v)?c.filter(x=>x!==v):[...c,v]}S.answers[s.id]=c;render()})}
 if(cta)$('#cta').addEventListener('click',()=>{if(!$('#cta').disabled)next()});
 if(s.bind)s.bind(m);
 $('#jump').value=s.id;history.replaceState(null,'','#'+s.id);
}
$('#back').onclick=back;
$('#tg').onclick=()=>document.body.classList.toggle('showsrc');
$('#jump').innerHTML=SCREENS.map(s=>`<option value="${s.id}">${s.n?pad(s.n):'—'} · ${s.id}</option>`).join('');
$('#jump').onchange=e=>go(e.target.value);
const start=SCREENS.findIndex(s=>s.id===location.hash.slice(1));if(start>0)idx=start;
if(new URLSearchParams(location.search).has('src'))document.body.classList.add('showsrc');
window.addEventListener('hashchange',()=>{const i=SCREENS.findIndex(s=>s.id===location.hash.slice(1));if(i>=0&&i!==idx){hist.push(idx);idx=i;render()}});
render();
/* бенчмарк справа: прокрутка панели вслед за экраном */
addEventListener('scroll',()=>{const p=document.querySelector('body.showsrc .src');if(!p||innerWidth<920)return;const k=scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight);p.scrollTop=k*(p.scrollHeight-p.clientHeight)},{passive:true});
</script>
