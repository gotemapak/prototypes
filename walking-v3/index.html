<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Depfit — walking prototype v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#0F202E; --text:#414142; --muted:#8A8A8E; --line:#E6E6E6; --idle:#BCBCBC;
  --accent:#FF2D55; --accent-top:#FF2D55; --accent-bot:#FF2D55; --accent-ink:#FFFFFF; --accent-soft:#FFF0F3; --accent-track:#FFD5DD; --coral:#FF5E50; --coral-soft:#FBB9B4; --lime:#3DBE6E; --lime-ink:#23994F; --lime-soft:#E8F7EE; /* один зелёный на всю воронку (правка 2) */
  --dot:#E3E6EC; --ok:#3DBE6E; --star:#FFC107; --zebra:#FAFBF6; --warn:#FF2D55;
  --grad:linear-gradient(180deg,var(--accent-top),var(--accent-bot));
  --r:14px; --rc:16px; --serif:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif; --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,Segoe UI,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F2F2F4;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:440px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px 0;min-height:44px}
.back{width:36px;height:36px;border:0;background:transparent;font-size:30px;line-height:1;color:var(--idle);cursor:pointer}
.back[hidden]{visibility:hidden;display:block}
.logo,.count{display:none}
.bar{display:none}
.sections{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px 24px 0;min-height:16px}
.sections i{width:6px;height:6px;border-radius:50%;background:var(--dot)}
.sections i.on{background:var(--accent)}
main{flex:1;padding:24px 24px 130px;text-align:center}
h1,h2{font-family:var(--sans);font-weight:800;color:var(--ink);letter-spacing:-.01em}
h1{font-size:30px;line-height:1.3;margin-bottom:12px}
h2{font-size:28px;line-height:1.3;margin-bottom:12px}
.sub{color:var(--text);font-weight:300;font-size:16px;line-height:1.55;margin:0 auto 24px;max-width:340px}
.sub b{font-weight:700;color:var(--ink)}
.sub.grey{color:var(--muted);font-weight:400}
p{color:var(--text)}
.opts{display:flex;flex-direction:column;gap:16px;text-align:left}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:14px 16px 14px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);font:600 16px var(--sans);color:var(--ink);text-align:left;cursor:pointer;transition:border-color .15s}
.opt:hover{border-color:#D0D0D0}
.opt.sel{border-color:var(--accent);background:var(--card)}
.opt .box{order:2;width:22px;height:22px;border:2px solid var(--idle);border-radius:50%;flex:none;display:grid;place-items:center;margin-left:auto}
.opt.sel .box{border-color:var(--accent)}
.opt.sel .box:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.opts.multi .opt .box{border-radius:7px}
.opts.multi .opt.sel .box{background:var(--accent)}
.opts.multi .opt.sel .box:after{width:5px;height:10px;border-radius:0;background:none;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt small{display:block;color:var(--muted);font-size:14px;font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.agecard{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);overflow:hidden;cursor:pointer;font:inherit;color:inherit;padding:0;text-align:left;transition:border-color .15s}
.agecard.sel,.agecard:hover{border-color:var(--accent)}
.agecard .ph{aspect-ratio:4/5;border-radius:0;margin:0}
.agecard>span{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700;background:var(--grad);color:#fff}
.ph{background:linear-gradient(160deg,#F4F4F6,#E7E7EB);border-radius:var(--rc);display:flex;align-items:flex-end;padding:10px;color:#8A8A8E;font-size:12px;line-height:1.3;margin:6px 0 20px;min-height:120px;text-align:left}
.ph b{font-weight:700}
img.ph.pic{display:block;width:100%;height:auto;min-height:0!important;padding:0;background:none;object-fit:cover;aspect-ratio:1200/780}
img.ph.pic.cut{aspect-ratio:auto;object-fit:contain;max-height:300px}
img.thumb.pic{padding:0;background:none;object-fit:cover}
.agec img.ph.pic{aspect-ratio:1;object-fit:cover}
.zones img.ph.pic{max-height:none;height:100%;object-fit:contain}
.ng img.ph.pic{aspect-ratio:600/900;height:auto}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;padding:12px 24px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,255,255,0),#fff 30%)}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:var(--r);background:var(--grad);color:var(--accent-ink);font:600 16px var(--sans);cursor:pointer;box-shadow:0 8px 20px rgba(255,45,85,.28)}
.btn:disabled{background:#FFB8C6;box-shadow:none;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600;margin-top:12px}
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:16px 18px;margin:16px 0;text-align:left}
.big{font-family:var(--sans);font-size:44px;line-height:1.1;color:var(--accent);font-weight:800}
.cite{font-size:13px;color:var(--muted);margin-top:8px}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 20px;min-height:56px;margin-bottom:16px;text-align:left}
.field:focus-within{border-color:var(--accent)}
.field{min-width:0}
.field input{flex:1;width:100%;border:0;outline:0;font:700 22px var(--sans);background:transparent;color:var(--ink);min-width:0}
.field label{color:var(--muted);font-size:16px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:3px;margin-bottom:20px}
.seg button{border:0;background:transparent;padding:8px 20px;border-radius:var(--r);font:600 15px var(--sans);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--grad);color:#fff}
.bmi{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,#4BCBF6,#3DBE6E 35%,#FFC107 65%,#FF2D55);margin:34px 0 8px}
.bmi i{position:absolute;top:-32px;transform:translateX(-50%);background:var(--ink);color:#fff;font:700 13px var(--sans);padding:3px 9px;border-radius:10px;white-space:nowrap}
.bmi i:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;text-align:left}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-size:14px;color:var(--muted)}
.kv b{display:block;color:var(--ink);font-size:18px;font-weight:800}
.steps{list-style:none;margin:24px 0;text-align:left}
.steps li{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-weight:600}
.steps li span{color:var(--muted);font-size:14px;font-weight:400}
.steps li.done span{color:var(--accent);font-weight:700}
.track{height:4px;background:#E6E6E6;border-radius:2px;overflow:hidden;margin-top:8px}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s}
.review{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:16px;margin:12px 0;text-align:left}
.review p{font-size:15px;font-weight:300;line-height:1.6}
.review footer{margin-top:10px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:50%;background:#EDEDF0;flex:none;display:grid;place-items:center;font-size:10px;color:#8A8A8E}
.stars{color:var(--star);letter-spacing:3px;font-size:17px}
svg.chart{width:100%;height:auto;margin:8px 0 6px}
.sticky{position:sticky;top:0;z-index:5;background:var(--grad);color:#fff;margin:-24px -24px 20px;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600}
.sticky b{font-variant-numeric:tabular-nums;font-size:18px}
.nowgoal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.nowgoal div{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:10px;text-align:center;font-size:14px;color:var(--muted)}
.nowgoal .ph{min-height:150px;margin:0 0 8px}
.nowgoal b{display:block;color:var(--ink);font-size:16px}
.plan{border:2px solid var(--accent);background:var(--card);border-radius:var(--rc);padding:18px;margin:16px 0;position:relative;text-align:left}
.plan .tag{position:absolute;top:-12px;left:16px;background:var(--grad);color:#fff;font-size:12px;font-weight:700;padding:3px 12px;border-radius:12px}
.plan .row{display:flex;justify-content:space-between;align-items:baseline}
.plan .price{font-size:34px;font-weight:800}
.plan s{color:var(--muted);font-size:16px}
.fine{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;text-align:left}
.list{list-style:none;margin:10px 0;text-align:left}
.list li{padding:9px 0 9px 30px;position:relative;font-weight:500}
.list li:nth-child(odd){background:var(--zebra)}
.list li:before{content:"";position:absolute;left:8px;top:15px;width:12px;height:7px;border:solid var(--ok);border-width:0 0 2px 2px;transform:rotate(-45deg)}
details{border-bottom:1px solid var(--line);padding:14px 0;text-align:left}
summary{font-weight:700;cursor:pointer}
details p{color:var(--text);margin-top:8px;font-size:15px;font-weight:300}
.pay{display:flex;gap:8px;justify-content:center;margin:12px 0;font-size:12px;color:var(--muted)}
.pay span{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card)}
.src{display:none;margin:22px 0 0;padding:12px 14px;border:1px dashed #C9C9CF;border-radius:12px;background:#F6F6F8;font-size:13px;color:#555;line-height:1.45;text-align:left}
body.showsrc .src{display:block}
/* s42: попап сверху, источник ниже попапа и поверх затемнения */
@media (max-width:919px){
 body.showsrc .s42pad{height:78vh}
 .s42pad~.src{position:relative;z-index:45}
 body.showsrc main>.modal{position:absolute;align-items:flex-start!important;padding-top:28px!important}
}
@media (min-width:920px){
 body.showsrc .app{margin:0 auto 0 calc(50% - 450px)}
 body.showsrc .cta{left:calc(50% - 450px);transform:none}
 body.showsrc .modal{left:calc(50% - 450px);right:auto;width:440px}
 body.showsrc .src{position:fixed;left:calc(50% + 10px);top:0;width:440px;height:100vh;overflow-y:auto;margin:0;border:0;border-left:1px dashed #C9C9CF;border-radius:0;padding:16px 20px 40px;z-index:5}
 body.showsrc .src img{max-width:100%;margin-top:10px}
 body.showsrc .toggle,body.showsrc .jump{right:auto;left:calc(50% + 480px)}
}
.toggle{position:fixed;right:12px;top:12px;z-index:50;background:var(--ink);color:#fff;border:0;border-radius:20px;padding:8px 12px;font:500 13px var(--sans);cursor:pointer;opacity:.85}
.jump{position:fixed;right:12px;top:52px;z-index:50;font:13px var(--sans);max-width:150px}
@media (max-width:700px){.toggle{top:auto;right:auto;left:10px;bottom:96px;padding:6px 10px;font-size:12px;opacity:.7}.jump{display:none}}
.modal{position:fixed;inset:0;background:rgba(15,32,46,.5);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:#fff;width:100%;max-width:440px;border-radius:32px 32px 0 0;padding:26px 24px 28px;text-align:center}
.mock{border:1.5px dashed #D0D0D6;border-radius:var(--rc);padding:18px;text-align:center;color:var(--muted);font-size:15px;margin:16px 0}

/* ---------- v3: структура WalkFit indoor в стиле v2 ---------- */
header{justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;height:30px}.logo img{height:26px;display:block}.logo img.ic{height:30px;width:30px;border-radius:8px}
.count{display:block;min-width:36px;text-align:right;font-size:14px;font-weight:600;color:var(--muted)}
.bar{display:block;height:4px;background:var(--line);margin:10px 16px 0;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lime);border-radius:2px;transition:width .3s}
.sections{display:none}
.btn{text-transform:none;letter-spacing:0;font-weight:600}
.link{display:block;margin:14px auto 0;background:none;border:0;font:600 14px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.opt .box{order:0;margin-left:0}
.opt .lbl{flex:1}
.opt .emo{font-size:26px;line-height:1;flex:none}
.thumb{width:56px;height:56px;border-radius:14px;background:linear-gradient(160deg,#F4F4F6,#E7E7EB);font-size:9px;line-height:1.15;color:#8A8A8E;display:grid;place-items:center;text-align:center;padding:4px;flex:none;font-weight:400}
.sig{display:flex;gap:3px;align-items:flex-end;flex:none}
.sig i{width:5px;background:var(--line);border-radius:1px}
.sig i.on{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips .opt{width:auto;min-height:44px;padding:10px 16px;justify-content:center;text-align:center}
.chips .box,.zones .box{display:none}
.zones{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:stretch}
.zones .ph{margin:0;min-height:100%}
.zones .opts{gap:10px}
.zones .opt{justify-content:center;text-align:center;min-height:46px;padding:10px}
.agegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;margin-top:8px}
.agec{background:none;border:0;cursor:pointer;font:inherit;padding:0}
.agec .ph{aspect-ratio:1;border-radius:50%;margin:0 0 -16px;min-height:0;align-items:center;justify-content:center;text-align:center}
.agec>span{position:relative;display:inline-flex;gap:8px;align-items:center;padding:8px 18px;border-radius:20px;background:var(--grad);color:#fff;font-weight:700}
.kicker{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin:-6px 0 18px}
.left{text-align:left}
.left .sub{margin-left:0}
.hint{background:#FFF8EC;border-radius:var(--rc);padding:14px 16px;text-align:left;margin-top:8px;font-size:15px}
.hint b{display:block;margin-bottom:4px;color:var(--ink)}
.err{color:var(--warn);font-size:14px;min-height:20px;margin:-6px 0 8px;text-align:left}
.field.big input{font-size:34px;text-align:center}
.field.big{justify-content:center}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.stat3 div{background:var(--accent-soft);border-radius:16px;padding:10px 6px;font-size:12px;color:var(--muted);text-align:center}
.stat3 b{display:block;color:var(--ink);font-size:16px}
.weekrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10px;color:var(--muted);text-align:center;margin:6px 0}
.weekrow i{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 3px;border-radius:50%;border:2px solid var(--accent-track);font-style:normal;font-size:11px;color:var(--ink)}
.weekrow i.d{background:var(--accent);border-color:var(--accent);color:#fff}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:13px;color:var(--ink);margin:4px 0}
.wkh{color:var(--muted);font-size:14px;margin-top:10px}
.wk i{position:relative;display:block;width:34px;height:34px;margin:4px auto 4px}
.wk svg.dr{width:34px;height:34px;display:block}
.wk .st{position:absolute;right:-5px;bottom:-3px;width:15px;height:15px;border-radius:4px;background:#FFB547;color:#fff;font-size:9px;line-height:15px;font-style:normal}
.wk em{font-style:normal;display:block}
.wk em.rest,.wk em.part{color:var(--muted)}
.wk.streak{position:relative}
.wk.streak:before{content:"";position:absolute;left:0;right:0;top:2px;height:40px;border-radius:20px;background:var(--accent-soft);z-index:0}
.wk.streak>div{position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:16px;margin:12px 0;text-align:left}
.rowkv{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.rowkv:last-child{border-bottom:0}
.rowkv b{color:var(--ink)}
.risk{background:var(--accent-soft);border-radius:var(--rc);padding:14px 16px;text-align:left;font-size:14px}
.risk b{display:block;color:var(--ink);margin-bottom:4px}
.risk.p-ok{background:var(--lime-soft)}.risk.p-warn{background:#FFF6DC}.risk.p-bad{background:var(--accent-soft)}
.g39{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;margin:4px 0 14px;text-align:left}
.g39 img.ph.pic{aspect-ratio:auto;max-height:190px;object-fit:contain}
.r39{padding:6px 0}
.r39 small{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.r39 b{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--ink);line-height:1.3}
.r39 b img{width:20px;height:20px;flex:none;object-fit:contain}
.ring{width:170px;height:170px;margin:6px auto 10px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:800;color:var(--ink)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -24px 0;padding:0 24px 8px}
.carousel .review{flex:0 0 82%;scroll-snap-align:start;margin:0}
.pill{display:inline-flex;gap:8px;align-items:center;justify-content:center;width:100%;background:var(--lime-soft);border:1.5px solid var(--lime);color:var(--ink);font-size:13px;font-weight:800;letter-spacing:.04em;padding:8px 14px;border-radius:20px;margin:4px 0 14px}
.red{color:var(--accent)}
.green{color:var(--lime-ink)}
.splash{position:fixed;inset:0;z-index:30;background:#fff;color:var(--ink);overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px}
.splash small{font-size:18px;color:var(--text);position:relative}
.splash img.lg{height:44px;margin:8px 0 28px;position:relative}
.splash:before,.splash:after{content:"";position:absolute;border-radius:50%;right:-120px;bottom:-140px;width:360px;height:360px;background:var(--coral-soft)}
.splash:after{right:-170px;bottom:-170px;width:330px;height:330px;background:var(--coral)}

.splash p{color:var(--ink);font-size:19px;font-weight:600;margin:6px 0;opacity:0;animation:fi .5s forwards;position:relative;z-index:1}
.splash .btn{margin-top:30px;max-width:340px;opacity:0;animation:fi .5s 2.2s forwards;position:relative;z-index:1}
@keyframes fi{to{opacity:1}}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--accent-track);border-top-color:var(--accent);margin:40vh auto 0;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.thumb.pic[src$="depfit-logo.png"]{object-fit:contain;padding:8px 6px;background:#fff;border:1px solid var(--line)}
/* paywall */
.topbar{position:sticky;top:0;z-index:6;background:#fff;margin:-24px -24px 16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);text-align:left}
.topbar small{display:block;font-size:12px;color:var(--text)}
.topbar b{font-size:24px;font-variant-numeric:tabular-nums}
.topbar .btn{width:auto;min-height:42px;padding:0 18px;font-size:14px}
.ng{border:1px solid var(--line);border-radius:var(--rc);overflow:hidden;margin-bottom:6px}
.ng .hd{display:grid;grid-template-columns:1fr 1fr;background:#F6F1EA;font-weight:700;padding:8px 0}
.ng .ph{margin:0;border-radius:0;min-height:170px}
.ng .cols{display:grid;grid-template-columns:1fr 1fr}
.ng .cols>div{padding:10px 12px;text-align:left;font-size:13px;color:var(--muted)}
.ng .cols>div+div{border-left:1px solid var(--line)}
.ng .cols b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

<div class="app">

  <main id="main"></main>
</div>
<script>
// Прототип v3: воронка WalkFit indoor (прогон 10 ноября 2026) экран в экран, тексты 1 в 1, бренд и стиль Depfit (экспорты depfit/design/app-depfit, 12 ноября 2026).
// Название бренда и домен вынесены в константы, чтобы заменить в одном месте в следующей итерации.
const BRAND='Depfit', DOMAIN='our website' /* домен Depfit — TBD */, LOGO='img/depfit-logo.png', ICON='img/depfit-icon.png', APP_URL='https://apps.apple.com/app/id1456357156';
const ORIG='orig/';

// ---------- state ----------
const S={answers:{},name:'',email:'',hu:'cm',wu:'kg',h:null,w:null,goal:null,age:null,event:'',plan:'w4',disc:61,t:600,exitShown:false};
const fmtL=d=>d.toLocaleDateString('en-US',{month:'long',day:'numeric'});
const fmtS=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return d};
const kg=v=>S.wu==='kg'?v:v/2.2046;
const hm=()=>S.h?(S.hu==='cm'?S.h/100:S.h*0.0254):1.86;
const wkg=()=>S.w?kg(S.w):95, gkg=()=>S.goal?kg(S.goal):89;
const bmi=()=>wkg()/(hm()*hm());
const goalTxt=()=>`${S.goal||89} ${S.wu}`;
// s46: срок как у WalkFit (getBMIBasedWeightLossIndexPerWeek): похудение — разница в кг / темп по BMI (до 24.9 → 1, 25–29.9 → 1.5, 30–34.9 → 1.7, от 35 → 2 кг в неделю); набор — разница / 0.5; округление до недель
const pace=b=>b<=24.9?1:b<30?1.5:b<35?1.7:2;
const weeks=()=>{const d=wkg()-gkg();return Math.round(d>0?d/pace(bmi()):d<0?-d/0.5:0)};
let CUR=1;
const IMG={4:'img-004.jpg',6:'img-006.jpg',9:'img-009.png',11:'img-011.jpg',13:'img-013.jpg',17:'img-017.png',19:'img-019.png',25:'img-025.jpg',28:'img-028.jpg',33:'img-033.jpg',38:'img-038.jpg',39:'img-039.png',40:'img-040.png',43:'img-043.jpg'};
const ph=(t,st='',f)=>{f=f||IMG[CUR];return f?`<img class="ph pic${f.endsWith('.png')?' cut':''}" src="img/${f}" alt="${t.replace(/"/g,'')}" style="${st}">`:`<div class="ph" style="${st}"><span><b>Image ${String(CUR).padStart(3,'0')}</b> · ${t}</span></div>`};
const th=t=>/\.(png|jpg)$/.test(t)?`<img class="thumb pic" src="img/${t}" alt="">`:`<span class="thumb">${t}</span>`;
const sig=n=>`<span class="sig">${[6,9,12,15,18].map((h,i)=>`<i class="${i<n?'on':''}" style="height:${h}px"></i>`).join('')}</span>`;
// s22: кольцо прогресса дня (доля шагов от цели 6 000), кресло для дня отдыха
const RING=(steps,n)=>{const p=Math.min(1,steps/6000),c=2*Math.PI*13;return `<svg class="dr" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#fff" stroke="#F1F1F3" stroke-width="2.5"/><circle cx="16" cy="16" r="13" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 16 16)"/><text x="16" y="20.5" text-anchor="middle" font-size="12" fill="#0F202E">${n}</text></svg>`};
const CHAIR=`<svg class="dr" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#fff" stroke="#F1F1F3" stroke-width="1.5"/><g fill="#FFB547"><rect x="9" y="10" width="14" height="8" rx="3"/><rect x="7" y="14" width="4" height="8" rx="2"/><rect x="21" y="14" width="4" height="8" rx="2"/><rect x="10" y="17" width="12" height="4" rx="1.5" fill="#FF9F1C"/><rect x="9" y="22" width="2" height="2" rx="1"/><rect x="21" y="22" width="2" height="2" rx="1"/></g></svg>`;
const DONE=(star)=>`<svg class="dr" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="var(--accent)"/><path d="M10 16.5l4 4 8-8.5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>${star?'<span class="st">★</span>':''}`;
// s39: состояния по ответам — как в конфиге WalkFit (экран ob_feedback_summary_d), иконки строк — img/s39/
const S39={
 life:{"I get sleepy when I'm hungry":['Sedentary','life-sedentary'],'I am tired after I eat':['Sedentary','life-sedentary'],'I feel good':['Change seeker','life-change-seeker'],'I always feel energized':['Change seeker','life-change-seeker']}, // из s30
 ex:{Beginner:['Little or no exercise','ex-little'],Intermediate:['Light exercise','ex-light'],Advanced:['Moderate exercise','ex-moderate']}, // из s12
 act:{'Fewer than 20 mins':['Low','act-low'],'20-60 mins':['Intermediate','act-intermediate'],'1-2 hours':['Intermediate','act-intermediate'],'More than 2 hours':['High','act-high']}}; // из s15
const bmiPlaque=b=>b<25?['ok','👌','Good starting BMI to get a fit body','Research has shown that walking helps you boost your metabolism, lose weight, gain muscle strength, and improve heart health']:[b<=30?'warn':'bad',b<=30?'🤔':'☝️','Risks for an unhealthy BMI','High blood pressure, heart disease, stroke, type 2 diabetes, some types of cancer, osteoarthritis, back pain, all case mortality'];
const icon=x=>!x?'':x.startsWith('img:')?th(x.slice(4)):x.startsWith('sig:')?sig(+x.slice(4)):`<span class="emo">${x}</span>`;
const stars='<div class="stars">★★★★★</div>';
const LAUREL=c=>`<svg class="${c.trim()}" viewBox="0 0 60 100"><g fill="#DCD49A">${[0,1,2,3,4,5].map(i=>`<ellipse cx="${20+i*1.5}" cy="${86-i*14}" rx="5" ry="10" transform="rotate(${-40+i*6} ${20+i*1.5} ${86-i*14})"/><ellipse cx="${34+i*0.5}" cy="${80-i*14}" rx="4.5" ry="9" transform="rotate(${50-i*4} ${34+i*0.5} ${80-i*14})"/>`).join('')}</g><path d="M40 96 C18 80 14 40 26 6" stroke="#DCD49A" stroke-width="2.5" fill="none"/></svg>`;
const rv=(n,t)=>`<div class="review">${stars}<p>${t}</p><footer>${n}</footer></div>`;

// ---------- screens ----------
// n — номер экрана WalkFit; p — счётчик «p/52» (с 24-го экрана WalkFit показывает «/51»); type: q (одиночный, автопереход), m (мульти + CONTINUE), info, custom
const SCREENS=[
{id:'s01',n:1,type:'custom',noCta:true,src:'Возраст: сетка 2×2 круглых фото пар, подпись-пилюля, тап → дальше. Без счётчика и назад.',
 render:()=>`<h1>Walk Indoors to Lose Weight</h1><p class="kicker">ACCORDING TO YOUR AGE</p>
 <div class="agegrid">${[['25-35','couple 25–35','img-001-25-35.png'],['36-45','couple 36–45','img-001-36-45.png'],['46-55','couple 46–55','img-001-46-55.png'],['56+','couple 56+','img-001-56-plus.png']].map(([a,d,f])=>`<button class="agec" data-v="${a}">${ph(d,'',f)}<span>${a} <span>&rsaquo;</span></span></button>`).join('')}</div>
 <p class="fine" style="text-align:center;margin-top:22px">By continuing, you confirm and guarantee that you have read, understood, and agreed to our <u>Terms of Use</u>, <u>Privacy Policy</u>, and <u>Refund Policy</u>.</p>`,
 bind:m=>m.querySelectorAll('.agec').forEach(b=>b.onclick=()=>{S.answers.s01=b.dataset.v;next()})},
{id:'s02',n:2,p:2,type:'q',q:'Select your gender',opts:[['Female','💁‍♀️'],['Male','💁‍♂️']]},
{id:'s03',n:3,type:'info',html:()=>`<div class="big" style="margin-top:20px">36 million</div><p class="sub">users have chosen us</p>${ph('cut-out photo: three smiling women of different ethnicities, arms around each other, coral / mint / grey tees, leggings, white sneakers','min-height:300px','img-003.png')}`,cta:'Continue'},
{id:'s04',n:4,type:'info',html:()=>`${ph('plus-size blonde woman in red tank and navy leggings doing a high-knee march in a bright living room','min-height:240px')}<h2>Welcome to your indoor walking journey!</h2><p class="sub">Welcome to ${BRAND}! You are here to embark on a walking journey and achieve your daily step goal without leaving home. Let's better understand your specific goals and needs.</p>`},
{id:'s05',n:5,p:5,type:'m',q:'What do you want to achieve?',sub:'You can select multiple goals',opts:[['Lose weight','img:img-005-lose-weight.png'],['Get firm and toned','img:img-005-get-firm-and-toned.png'],['Relieve stress','img:img-005-relieve-stress.png'],['Lower biological age','img:img-005-lower-biological-age.png'],['Improve heart health','img:img-005-improve-heart-health.png']]},
{id:'s06',n:6,type:'info',html:()=>`${ph('woman in red tank and navy leggings, arms across chest in a stretch, living room','min-height:240px')}<h2>The first step has been taken!</h2><p class="sub">We have 520+ workouts to help you achieve your goals in the most customized, exciting, and easy way!</p>`},
{id:'s07',n:7,p:7,type:'q',q:'Choose your current body type',opts:[['Regular','img:img-007-regular.png'],['Flabby','img:img-007-flabby.png'],['Extra','img:img-007-extra.png']]},
{id:'s08',n:8,p:8,type:'q',q:'Choose your target body type',opts:[['A few pounds lighter','img:img-008-a-few-pounds-lighter.png'],['Fit','img:img-008-fit.png'],['Flat belly','img:img-008-flat-belly.png'],['Shapely','img:img-008-shapely.png']]},
{id:'s09',n:9,p:9,type:'m',layout:'zones',q:'Choose your target zones',img:'full-body cut-out: smiling blonde older woman in red tank, red leggings, white sneakers',opts:['Lower back','Belly','Buttocks','Hips','Thighs','Knees','Calves','Whole body'],cta:'Continue'},
{id:'s10',n:10,p:10,type:'q',q:'When were you last happy with your weight?',opts:[['Less than a year ago','🤔'],['1 to 2 years ago','😅'],['More than 3 years ago','😢'],["I'm happy with my weight",'😍'],['Never','❌']]},
{id:'s11',n:11,type:'info',html:()=>`${ph('smiling blonde woman in red V-neck tee, hands on hips, bright kitchen','min-height:240px')}<h2>You're amazing!</h2><p class="sub">Many people often grapple with the fear of not being good enough. We'll take this into account as we devise your plan to provide you with the confidence-building approach!</p>`},
{id:'s12',n:12,p:12,type:'q',q:'What is your activity level?',opts:[['Beginner','sig:1',"I'm just starting out"],['Intermediate','sig:2','I exercise somewhat consistently'],['Advanced','sig:5','I do regular workouts']]},
{id:'s13',n:13,type:'info',html:()=>`${ph('blonde woman in red tee and navy leggings marching mid-stride in the living room','min-height:220px')}<h2>Step into fitness: discover the benefits of indoor walking</h2><p class="sub">A ${BRAND} indoor walking plan is a convenient and weather-proof way to stay active, offering the same health benefits as outdoor walking, but without the need for favorable weather or even going outside.</p>`},
{id:'s14',n:14,p:14,type:'m',layout:'chips',q:'Choose your focus',opts:['Fat burn','Better shape','Energy boost','Improved physique','Better relaxation','Heart health','Better sleep','Increased life expectancy','Better mobility','Metabolism boost','Improved agility','Physical recovery'],cta:'Continue'},
{id:'s15',n:15,p:15,type:'q',q:'How much time do you spend walking on a typical day?',opts:[['Fewer than 20 mins','👌'],['20-60 mins','👍'],['1-2 hours','💪'],['More than 2 hours','🏅']]},
{id:'s16',n:16,p:16,type:'q',q:'How often do you go for walks?',opts:[['Almost every day','😎'],['3-4 times per week','💪'],['1-2 times per week','🙂'],['Usually about once a month','👍']]},
{id:'s17',n:17,type:'info',html:()=>`${ph('flat illustration: pair of green running shoes with a yellow sun on a pale-green circle','min-height:200px')}<h2>Why Indoor Walking Works</h2><p class="sub">Indoor home walking for 12 weeks was linked to improved walking endurance. It's a great way to <b>stay fit without leaving your house!</b></p><p class="cite">"Home-Based Walking Exercise and Supervised Treadmill Exercise: An Individual Participant Data Meta-Analysis." JAMA Network Open, JAMA Network, 21 Sept. 2023</p>`},
{id:'s18',n:18,p:18,type:'q',q:'How would you describe your work schedule?',opts:[['9 to 5','img:img-018-9-to-5.png'],['Night shifts','img:img-018-night-shifts.png'],['My schedule is flexible','img:img-018-flexible-schedule.png'],["I'm retired",'img:img-018-retired.png']]},
{id:'s19',n:19,type:'info',html:()=>`${ph('flat illustration: coral sneakers with an orange flame on a pale pink circle','min-height:200px')}<h2>The myth of 10,000 steps</h2><p class="sub">It's a great goal but not the best starting point. Studies show that slow and moderate paces are optimal for progress and motivation.</p>`},
{id:'s20',n:20,p:20,type:'q',q:'Do you wear a smartwatch or fitness tracker?',opts:[['Yes','✅'],['No','❌']],skip:v=>v==='No'?'s22':null,src:'Куда ведёт «No», краулер не снял (выбрал Yes). В прототипе «No» пропускает вопрос о модели часов.'},
{id:'s21',n:21,p:21,type:'m',q:'What kind of smartwatch or fitness tracker do you wear?',opts:['Apple Watch','Fitbit','Samsung Galaxy','Garmin','None of the above'],none:'None of the above'},
{id:'s22',n:22,p:22,type:'info',html:()=>`<div class="card"><div class="stat3"><div><b>14 days</b>finished</div><div><b>6,304</b>avg. steps</div><div><b>120,980</b>total steps</div></div>
 <div class="wk wkh">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<span class="${i===6?'red':''}">${d}</span>`).join('')}</div>
 <div class="wk">${[[5239,'d'],[4211,2],[0,'r'],[2980,4],[1210,5],[4910,6],[6890,'ds']].map(([s,t])=>`<div><i>${t==='r'?CHAIR:t==='d'||t==='ds'?DONE(t==='ds'):RING(s,t)}</i><em class="${t==='r'?'rest':typeof t==='number'?'part':''}">${t==='r'?'Rest':s.toLocaleString('en-US')}</em></div>`).join('')}</div>
 <div class="wk streak">${[[6017],[8000,1],[5029],[7300],[5239],[7890,1],['r']].map(([s,st])=>`<div><i>${s==='r'?CHAIR:DONE(st)}</i><em class="${s==='r'?'rest':''}">${s==='r'?'Rest':s.toLocaleString('en-US')}</em></div>`).join('')}</div></div>

{id:'s39',n:39,type:'info',cta:'Continue',src:'Логика из конфига WalkFit (все 5 прогонов краулера шли по первым ответам и совпали с ним). Плашка BMI — 3 версии: меньше 25 зелёная 👌, 25–30 жёлтая 🤔, больше 30 красная ☝️. Lifestyle — из s30 (sleepy / tired → Sedentary, good / energized → Change seeker); Exercise — из s12 (Beginner → Little or no, Intermediate → Light, Advanced → Moderate exercise); Activity level — из s15 (до 20 мин → Low, 20–60 мин и 1–2 ч → Intermediate, больше 2 ч → High). Картинка у WalkFit — 6 версий: пол (s02) × BMI (до 25, 25–30, от 30); в прототипе пока одна.',
 html:()=>{const b=bmi(),pos=Math.min(96,Math.max(4,(b-18.5)/(40-18.5)*100));
 const g=(map,k,d)=>map[S.answers[k]]||map[d];const L=g(S39.life,'s30','I get sleepy when I\'m hungry'),E=g(S39.ex,'s12','Beginner'),A=g(S39.act,'s15','Fewer than 20 mins');const [pc,pe,pt,px]=bmiPlaque(b);
 const row=(lab,[v,ic])=>`<div class="r39"><small>${lab}</small><b><img src="img/s39/${ic}.png" alt="">${v}</b></div>`;
 return `<h2>Summary of your fitness level</h2><div class="card"><div style="display:flex;justify-content:space-between;font-size:14px"><b>Body Mass Index (BMI)</b><span style="color:var(--muted)">Normal - 25.1</span></div>
 <div class="bmi" style="background:linear-gradient(90deg,#3DBE6E,#FFC107 45%,#FF9800 70%,#FF2D55)"><i style="left:${pos}%">You - ${b.toFixed(1)}</i></div><div class="scale"><span>NORMAL</span><span>OVERWEIGHT</span><span>OBESE</span></div></div>
 <div class="g39"><div>${row('Lifestyle',L)}${row('Exercise',E)}${row('Activity level',A)}</div>${ph('cut-out: slim woman in black sports bra and leggings, hands behind head','margin:0;min-height:150px')}</div>
 <div class="risk p-${pc}"><b>${pe} ${pt}</b>${px}</div>`}},
{id:'s40',n:40,type:'info',html:()=>`${ph('flat illustration: pink blob with white OK-hand gesture and sparkles','min-height:200px')}<h2>Walking can reduce the risk of cardiovascular diseases by 33%</h2><p class="sub">According to the the study in Journal of the American College of Cardiology, participants who engaged in as little as 10 minutes a day of brisk walking had 33% lower risk of death than those who had no physical activity.</p><p class="cite">*"Exercise Lowers Mortality Risk in Patients with Heart Disease." CardioSmart, American College of Cardiology, 30 Sept. 2017</p>`,src:'Опечатка «the the» — как у WalkFit.'},

{id:'s46',n:46,p:45,type:'info',cta:'Continue',src:'Дата цели — по коду WalkFit: сегодня + разница весов / темп по BMI (до 24.9 → 1 кг в неделю, 25–29.9 → 1.5, 30–34.9 → 1.7, от 35 → 2; набор веса — 0.5 кг в неделю), округление до недель. От даты события на s45 не зависит. Строка «Get ready to amaze everyone at your …» — только если на s44 выбран повод, не «No».',

{id:'s47',n:47,type:'custom',noCta:true,src:'Лоадер: кольцо с процентами, «36 million», карусель отзывов; на 100% автопереход к email.',
 render:()=>`<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="#F2F2F4" stroke-width="8" fill="none"/><circle id="arc" cx="50" cy="50" r="44" stroke="#FF2D55" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg><span id="pc">0%</span></div>
